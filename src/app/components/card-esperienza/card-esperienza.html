<!-- costruisce dinamicamente il percorso aggiungendo l'ID dell'esperienza all'URL-->
<a class="card h-100 experience-card" [routerLink]="'/esperienza/'+ esperienza.id">
    <img [src]="esperienza.immagine" [alt]="esperienza.titolo" class="card-img-top">

    <div class="card-body d-flex flex-column">

        <span class="badge text-bg-light align-self-start mb-2">
            {{ esperienza.categoria }}
        </span>

        <h5 class="card-title">
            {{ esperienza.titolo }}
        </h5>

        <p class="card-text text-secondary">
            {{ esperienza.descrizione }}
        </p>

        <div class="mt-auto d-flex justify-content-between align-items-center">

            <span class="fw-bold fs-5">
                € {{ esperienza.prezzo }}
            </span>

        </div>

    </div>
</a>
